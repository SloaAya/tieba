name: 自动同步上游仓库

on:
  schedule:
    # 每天凌晨2点执行（UTC时间，对应北京时间10点）
    - cron: '0 2 * * *'
  # 允许手动触发
  workflow_dispatch:

# 需要写入权限才能推送提交
permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    name: 同步上游仓库更新

    # 仅在 Fork 仓库中运行此工作流
    if: github.repository != 'chiupam/tieba'

    env:
      # 带 workflows 权限的 PAT：默认的 GITHUB_TOKEN 永远拿不到 workflows 权限，
      # 无法推送 .github/workflows 下的改动，必须用 PAT 才能同步上游的 CI 配置
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

    steps:
      - name: 校验 SYNC_TOKEN
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::未配置 SYNC_TOKEN 密钥，无法推送 workflow 文件改动。请在仓库 Settings → Secrets and variables → Actions 中添加。"
            exit 1
          fi
          echo "✅ 已配置 SYNC_TOKEN"

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 使用带 workflows 权限的 PAT，而不是默认的 GITHUB_TOKEN
          token: ${{ secrets.SYNC_TOKEN || github.token }}
          persist-credentials: true

      - name: 记录同步前的提交
        id: before
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"

      - name: 配置Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: 添加上游仓库
        run: |
          # 添加chiupam/tieba作为上游仓库
          git remote add upstream https://github.com/chiupam/tieba.git
          git remote -v

      - name: 获取上游更新
        run: |
          git fetch upstream
          echo "✅ 成功获取上游仓库的最新代码"

      - name: 备份需要保留的文件
        run: |
          if [ -f ".github/last_activity.md" ]; then
            echo "📦 备份本地的 last_activity.md 文件"
            cp .github/last_activity.md .github/last_activity.md.backup
          fi

      - name: 合并上游变更
        run: |
          CURRENT_BRANCH="${{ steps.before.outputs.branch }}"
          echo "当前分支: $CURRENT_BRANCH"

          # 执行合并
          if git merge upstream/"$CURRENT_BRANCH" --no-edit; then
            echo "✅ 已成功合并上游仓库的变更"
          else
            echo "⚠️ 合并过程中可能存在冲突，尝试使用策略解决..."
            # 尝试使用theirs策略解决冲突（接受上游更改）
            git merge --abort
            git merge upstream/"$CURRENT_BRANCH" -X theirs --no-edit
            echo "⚠️ 使用theirs合并策略完成，如有异常请手动检查"
          fi

      - name: 合并后收尾（保留本地配置）
        run: |
          BEFORE="${{ steps.before.outputs.sha }}"

          # 1) 还原本地的 last_activity.md
          if [ -f ".github/last_activity.md.backup" ]; then
            echo "📦 恢复本地的 last_activity.md 文件"
            mv .github/last_activity.md.backup .github/last_activity.md
            git add .github/last_activity.md
          fi

          # 2) 保留本文件的 SYNC_TOKEN 配置
          #    上游版本用的是默认 GITHUB_TOKEN，一旦被合并覆盖，
          #    下次同步又会因为缺少 workflows 权限而推送失败，所以必须还原。
          git checkout "$BEFORE" -- .github/workflows/sync-upstream.yml
          git add .github/workflows/sync-upstream.yml

          # 3) 有改动才提交
          if git diff --cached --quiet; then
            echo "没有需要保留的本地改动"
          else
            git commit -m "chore: 保留本地同步配置（SYNC_TOKEN / last_activity）"
            echo "✅ 已提交本地保留项"
          fi

      - name: 推送更新
        run: |
          # 推送到当前分支
          CURRENT_BRANCH="${{ steps.before.outputs.branch }}"

          # 只推送到Fork的仓库，不尝试推送到上游仓库
          if git push origin "$CURRENT_BRANCH"; then
            echo "✅ 已将更新推送到您的仓库"
          else
            echo "❌ 推送失败，可能需要手动检查"
            exit 1
          fi

      - name: 同步完成
        run: |
          echo "🎉 您的仓库已与上游仓库同步完成！"
          echo "📝 最新提交信息："
          git log -1 --pretty=format:"%h - %an: %s"
